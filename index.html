<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petit Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --sky1:#7ec8f0;--sky2:#a6dcf5;--sky3:#d4effa;
 --grass:#6abe30;--grass2:#4b8f22;--dirt:#8f5a2b;
 --wood:#c27a3a;--wood2:#8a4b24;--wood3:#5b2f14;
 --paper:#fbe9bf;--paper2:#f2d595;
 --ink:#4a2a12;--muted:#8d6440;
 --red:#e0533d;--green:#6abe30;--gold:#f7c843;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1b2450;--sky2:#2a3670;--sky3:#3f4c8c;--grass:#3f7a2a;--grass2:#2c5a1c}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:"Pixelify Sans","DotGothic16",monospace;font-size:16px;overflow-x:hidden;
 background:linear-gradient(var(--sky1) 0 30%,var(--sky2) 30% 55%,var(--sky3) 55% 100%);background-attachment:fixed;-webkit-font-smoothing:none}
.zh,.cn{font-family:"DotGothic16","Pixelify Sans",monospace}
.fr,.zh,.opt,input.sp,.item .t,.accents button{font-family:"Nunito","Avenir Next","PingFang SC","Hiragino Sans GB",system-ui,sans-serif!important;-webkit-font-smoothing:antialiased}
.fr{font-weight:800!important}.opt{font-weight:600}
svg.px{image-rendering:pixelated;shape-rendering:crispEdges;display:block}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0}
.cloud{position:absolute;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.ground{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:0;
 background:linear-gradient(var(--grass) 0 14px,var(--grass2) 14px 20px,var(--dirt) 20px);
 box-shadow:0 -4px 0 var(--grass2)}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:16px 16px 90px}
/* pixel panel: stepped corners via box-shadow */
.panel{background:var(--paper);position:relative;margin:4px;
 box-shadow:0 0 0 4px var(--wood2),0 0 0 8px var(--wood3),inset 0 -4px 0 var(--paper2);padding:14px}
.sign{background:var(--wood);color:#fff4d6;text-shadow:2px 2px 0 var(--wood3);
 box-shadow:0 0 0 4px var(--wood3),inset 0 -4px 0 var(--wood2),inset 0 4px 0 #d9944f}
header{display:flex;align-items:center;gap:14px;margin:8px 4px 20px;padding:12px 14px}
header h1{margin:0;font-size:28px;letter-spacing:1px;font-weight:700}
header .sub{font-size:14px;opacity:.95;margin-top:4px}
#mascot{cursor:pointer;flex:none;animation:hop 1.2s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 4px 18px}
.stat{display:flex;align-items:center;gap:8px;padding:10px}
.stat b{font-size:22px;line-height:1}
.stat small{display:block;font-size:12px;color:var(--muted)}
.goal{margin:0 4px 20px}
.goal .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.bar{height:16px;background:#5b2f14;padding:3px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 8px,#8fd44f 8px 12px);transition:width .4s steps(8)}
.decks{display:flex;gap:14px;overflow-x:auto;padding:8px 8px 14px;margin:0 -4px 6px}
.deck{flex:0 0 78px;border:0;cursor:pointer;font:inherit;color:var(--ink);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.deck .n{font-size:13px}.deck small{font-size:11px;color:var(--muted)}
.deck.on{background:#fff6dc;box-shadow:0 0 0 4px var(--gold),0 0 0 8px var(--wood3);transform:translateY(-2px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;margin:0 4px 20px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px}
.match .opt{min-height:56px;font-size:15px}
.match .opt.sel{background:#fff1a8;box-shadow:0 0 0 4px var(--gold),0 0 0 8px var(--wood3)}
.match .opt.gone{visibility:hidden}
.result{text-align:center;padding:24px 14px;margin:4px;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .score{font-size:44px;font-weight:700;color:var(--wood2)}
.settings{margin:40px 4px 0;font-size:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.settings select,.settings button{font:inherit;border:0;padding:6px 10px;cursor:pointer}
.settings select{background:#fff8e6;box-shadow:inset 0 0 0 3px var(--wood2);color:var(--ink)}
.due{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 20px;padding:12px 14px}
.tab{border:0;font:inherit;font-size:14px;cursor:pointer;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.course{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 4px 16px}
.course .tab{padding:10px 4px}.course b{font-size:18px}.course small{font-size:12px;opacity:.9}
.tab.on{background:#7a9c3a;box-shadow:0 0 0 4px #3d5a1a,inset 0 -4px 0 #5d7d29,inset 0 4px 0 #9cc152}
.card{text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;cursor:pointer;user-select:none;margin:4px 4px 0}
.fr{font-size:32px;font-weight:700;word-break:break-word;line-height:1.15}
.zh{font-size:22px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.gender{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;color:#fff;font-family:"DotGothic16",monospace}
.gender.m{background:#4a8fe0;box-shadow:0 0 0 3px #2c5fa8}.gender.f{background:#e8729a;box-shadow:0 0 0 3px #b2456c}
.foot{text-align:center;font-size:12px;color:#fff4d6;margin-top:28px;line-height:1.8;text-shadow:1px 1px 0 var(--wood3)}.foot a{color:#fff4d6}
.swatch{width:56px;height:56px;box-shadow:0 0 0 4px var(--wood3)}
.row{display:flex;gap:14px;margin:22px 4px 0}
.btn{flex:1;border:0;font:inherit;font-size:16px;font-weight:600;cursor:pointer;padding:12px 6px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active,.opt:active,.tab:active,.deck:active{transform:translateY(3px)}
.btn.go{background:#7a9c3a;box-shadow:0 0 0 4px #3d5a1a,inset 0 -4px 0 #5d7d29,inset 0 4px 0 #9cc152;color:#fff;text-shadow:2px 2px 0 #3d5a1a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 4px 0}
.opt{border:0;font:inherit;font-size:17px;color:var(--ink);cursor:pointer;padding:14px 8px;background:var(--paper);box-shadow:0 0 0 4px var(--wood2),0 0 0 8px var(--wood3),inset 0 -4px 0 var(--paper2)}
.opt.ok{background:#b6e07a;box-shadow:0 0 0 4px #4b8f22,0 0 0 8px #2c5a1c,inset 0 -4px 0 #95c75a}
.opt.no{background:#f4a08d;box-shadow:0 0 0 4px #b33a26,0 0 0 8px #6e1f12,inset 0 -4px 0 #e07b66}
.play{border:0;cursor:pointer;padding:18px;background:var(--wood)}
input.sp{width:100%;font:inherit;font-size:22px;padding:10px;border:0;background:#fff8e6;color:var(--ink);text-align:center;box-shadow:inset 0 0 0 4px var(--wood2),inset 4px 4px 0 4px #e8cf98;outline:none}
.accents{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.accents button{border:0;font:inherit;font-size:16px;cursor:pointer;padding:4px 10px;min-width:34px}
.toast{text-align:center;min-height:28px;margin-top:18px;font-size:18px;font-weight:600;color:#fff;text-shadow:2px 2px 0 var(--wood3)}
.list{display:grid;gap:18px;margin:0 4px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px}
.item .t{flex:1}.item small{color:var(--muted)}
.item button{border:0;cursor:pointer;padding:6px}
.empty{text-align:center;padding:28px 10px;margin:4px;display:flex;flex-direction:column;align-items:center;gap:12px}
a.link{color:var(--wood2);text-decoration:underline;cursor:pointer}
.pop{animation:pop .3s steps(3)}@keyframes pop{50%{transform:scale(1.04)}}
.shake{animation:shake .3s steps(4)}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;top:-30px;pointer-events:none;animation:fall 1.8s steps(18) forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh)}}
</style>
</head>

<div class="clouds" id="clouds"></div>
<div class="ground"></div>
<div class="wrap">

    <div class="panel stat"><span data-i="flame"></span><div><b id="streak">0</b><small class="cn">连续天数</small></div></div>
    <div class="panel stat"><span data-i="star"></span><div><b id="xp">0</b><small class="cn">经验值</small></div></div>

  </div>
  <div class="panel goal"><div class="lbl cn"><span>今日目标</span><span id="goalTxt"></span></div><div class="bar"><i id="goalBar"></i></div></div>
  <div class="course" id="course"></div>
  <div class="decks" id="decks"></div>
  <div class="tabs">
    <button class="tab sign on" data-m="card"><span data-i="cardI"></span><span class="cn">卡片</span></button>
    <button class="tab sign" data-m="quiz"><span data-i="quill"></span><span class="cn">选择</span></button>
    <button class="tab sign" data-m="listen"><span data-i="speaker"></span><span class="cn">听力</span></button>
    <button class="tab sign" data-m="spell"><span data-i="keys"></span><span class="cn">拼写</span></button>
    <button class="tab sign" data-m="match"><span data-i="pair"></span><span class="cn">配对</span></button>
    <button class="tab sign" data-m="test"><span data-i="medal"></span><span class="cn">测验</span></button>
    <button class="tab sign" data-m="book"><span data-i="book"></span><span class="cn">复习</span></button>
  </div>
  <div id="view"></div>
  <div class="panel settings cn">
    <label>每日目标 <select id="goalSel"><option>30</option><option>50</option><option>100</option><option>200</option></select> 经验</label>
    <label>语速 <select id="rateSel"><option value="0.75">慢</option><option value="0.95">自然</option><option value="1.05">快</option></select></label>
    <label>声音 <select id="voiceSel" style="max-width:170px"></select></label>
    <button class="sign" id="reset">重置进度</button>
  </div>
  <footer class="foot cn">© 2026 Alice Yu (JIATIAN YU). All rights reserved.<br>

loadVoice();$("#voiceSel").onchange=e=>{S.voice=e.target.value;save();loadVoice();speak("Bonjour, comment ça va ?")};
$("#goalSel").value=S.goal;$("#rateSel").value=S.rate;
$("#goalSel").onchange=e=>{S.goal=GOAL=+e.target.value;goalDone=S.today>=GOAL;save();stats()};
$("#rateSel").onchange=e=>{S.rate=+e.target.value;save();speak("Bonjour")};
$("#reset").onclick=()=>{if(confirm("确定清空所有学习进度吗？")){S={xp:0,known:{},streak:1,last:new Date().toDateString(),today:0,wrong:{},box:{},goal:S.goal,rate:S.rate,best:{}};save();goalDone=false;decks();render()}};
courses();decks();render();
</script>
